<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Preferencias de Color - Encuesta</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>Panel de Visualización de Preferencias de Color</h1>

  <div class="controls">
    <div class="filtros">
      <strong>Filtrar por rango de edad:</strong>
      <!-- Checkboxes se insertan con JS -->
    </div>
    <div>
      <label><input type="checkbox" id="toggleNulls" checked /> Incluir datos sin edad</label>
    </div>
  </div>

  <div class="charts">
    <!-- Gráfica de barras general por color -->
    <div class="chart-box">
      <h2>Preferencias Generales por Color</h2>
      <canvas id="barChart"></canvas>
    </div>

    <!-- Gráfica de pastel por edad para un color -->
    <div class="chart-box">
      <h2>Distribución por Edad del Color Seleccionado</h2>
      <canvas id="pieChart"></canvas>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
